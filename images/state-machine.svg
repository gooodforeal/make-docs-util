<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440">
  <defs>
    <style>
      .st { fill: #f4f7fb; stroke: #1e3a5f; stroke-width: 1.6; }
      .safe { fill: #fff4e5; stroke: #b06820; stroke-width: 1.6; }
      .fault { fill: #fdecea; stroke: #9b2c2c; stroke-width: 1.6; }
      .act { fill: #e7f5ea; stroke: #2d5a3d; stroke-width: 1.6; }
      .t { font: 700 13px Arial, Helvetica, sans-serif; fill: #1a2744; }
      .s { font: 11px Arial, Helvetica, sans-serif; fill: #3d4a63; }
      .e { font: 11px Arial, Helvetica, sans-serif; fill: #1e3a5f; }
      .arr { stroke: #1e3a5f; stroke-width: 1.35; fill: none; marker-end: url(#ah); }
    </style>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1e3a5f"/>
    </marker>
  </defs>
  <rect width="920" height="440" fill="#ffffff"/>

  <rect x="40" y="30" width="120" height="52" rx="8" class="st"/>
  <text x="100" y="52" text-anchor="middle" class="t">BOOT</text>
  <text x="100" y="70" text-anchor="middle" class="s">u = u_safe</text>

  <rect x="220" y="30" width="120" height="52" rx="8" class="st"/>
  <text x="280" y="52" text-anchor="middle" class="t">JOIN</text>
  <text x="280" y="70" text-anchor="middle" class="s">HELLO, ключ</text>

  <rect x="400" y="30" width="120" height="52" rx="8" class="st"/>
  <text x="460" y="52" text-anchor="middle" class="t">IDLE</text>
  <text x="460" y="70" text-anchor="middle" class="s">консенсус, u_min</text>

  <rect x="400" y="160" width="120" height="52" rx="8" class="act"/>
  <text x="460" y="182" text-anchor="middle" class="t">ACTIVE</text>
  <text x="460" y="200" text-anchor="middle" class="s">busy + коридор</text>

  <rect x="400" y="290" width="120" height="52" rx="8" class="st"/>
  <text x="460" y="312" text-anchor="middle" class="t">HOLD</text>
  <text x="460" y="330" text-anchor="middle" class="s">12 с после спада</text>

  <rect x="620" y="30" width="120" height="52" rx="8" class="st"/>
  <text x="680" y="52" text-anchor="middle" class="t">CRIT</text>
  <text x="680" y="70" text-anchor="middle" class="s">u = 1.0</text>

  <rect x="620" y="160" width="120" height="52" rx="8" class="safe"/>
  <text x="680" y="182" text-anchor="middle" class="t">SAFE</text>
  <text x="680" y="200" text-anchor="middle" class="s">потеря сети</text>

  <rect x="620" y="290" width="120" height="52" rx="8" class="fault"/>
  <text x="680" y="312" text-anchor="middle" class="t">FAULT</text>
  <text x="680" y="330" text-anchor="middle" class="s">авария драйвера</text>

  <line x1="160" y1="56" x2="220" y2="56" class="arr"/>
  <text x="190" y="48" text-anchor="middle" class="e">DODAG</text>
  <line x1="340" y1="56" x2="400" y2="56" class="arr"/>
  <text x="370" y="48" text-anchor="middle" class="e">JOIN_OK</text>
  <line x1="460" y1="82" x2="460" y2="160" class="arr"/>
  <text x="478" y="124" class="e">P(o) &gt; theta_on</text>
  <line x1="460" y1="212" x2="460" y2="290" class="arr"/>
  <text x="478" y="256" class="e">P(o) &lt; theta_off</text>
  <path d="M400,316 C340,316 340,56 400,56" class="arr"/>
  <text x="300" y="200" class="e">истёк HOLD</text>

  <line x1="520" y1="56" x2="620" y2="56" class="arr"/>
  <text x="570" y="48" text-anchor="middle" class="e">critical</text>
  <line x1="520" y1="186" x2="620" y2="186" class="arr"/>
  <text x="568" y="176" text-anchor="middle" class="e">нет соседей</text>
  <line x1="520" y1="316" x2="620" y2="316" class="arr"/>
  <text x="568" y="306" text-anchor="middle" class="e">ток / обрыв</text>

  <text x="40" y="400" class="s">Из SAFE узел возвращается в JOIN после появления HELLO. Из FAULT — только после ремонта и сброса.</text>
  <text x="40" y="420" class="s">Любое состояние, кроме FAULT, может принять POLICY с флагом CRIT и перейти в CRIT.</text>
</svg>
