<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420">
  <defs>
    <style>
      .t { font: 700 15px Arial, Helvetica, sans-serif; fill: #1a2744; }
      .s { font: 12px Arial, Helvetica, sans-serif; fill: #3d4a63; }
      .ax { stroke: #1a2744; stroke-width: 1.4; }
      .grid { stroke: #d5dbe3; stroke-width: 1; }
    </style>
  </defs>
  <rect width="920" height="420" fill="#ffffff"/>
  <text x="24" y="28" class="t">Сравнение законов управления (ночь 18:00–07:00)</text>
  <text x="24" y="50" class="s">Левые столбцы — энергия участка, кВт·ч. Правые точки — доля нарушений нормы ν, %.</text>

  <line x1="80" y1="80" x2="80" y2="340" class="ax"/>
  <line x1="80" y1="340" x2="520" y2="340" class="ax"/>
  <line x1="80" y1="80" x2="520" y2="80" class="grid"/>
  <line x1="80" y1="154" x2="520" y2="154" class="grid"/>
  <line x1="80" y1="228" x2="520" y2="228" class="grid"/>
  <line x1="80" y1="284" x2="520" y2="284" class="grid"/>
  <text x="70" y="344" text-anchor="end" class="s">0</text>
  <text x="70" y="288" text-anchor="end" class="s">4</text>
  <text x="70" y="232" text-anchor="end" class="s">8</text>
  <text x="70" y="158" text-anchor="end" class="s">12</text>
  <text x="70" y="84" text-anchor="end" class="s">16</text>
  <text x="36" y="210" transform="rotate(-90 36,210)" class="s">W, кВт·ч</text>

  <rect x="120" y="125.5" width="56" height="214.5" fill="#4a6fa5"/>
  <rect x="220" y="159.8" width="56" height="180.2" fill="#6b8f71"/>
  <rect x="320" y="218.5" width="56" height="121.5" fill="#c4a35a"/>
  <rect x="420" y="239.1" width="56" height="100.9" fill="#c45c26"/>

  <text x="148" y="360" text-anchor="middle" class="s">CONST</text>
  <text x="248" y="360" text-anchor="middle" class="s">ASTRO</text>
  <text x="348" y="360" text-anchor="middle" class="s">LOCAL</text>
  <text x="448" y="360" text-anchor="middle" class="s">LUMEN</text>

  <text x="148" y="118" text-anchor="middle" class="s">13.20</text>
  <text x="248" y="152" text-anchor="middle" class="s">11.09</text>
  <text x="348" y="211" text-anchor="middle" class="s">7.48</text>
  <text x="448" y="232" text-anchor="middle" class="s">6.21</text>

  <line x1="600" y1="80" x2="600" y2="340" class="ax"/>
  <line x1="600" y1="340" x2="880" y2="340" class="ax"/>
  <text x="590" y="344" text-anchor="end" class="s">0</text>
  <text x="590" y="275" text-anchor="end" class="s">0.5</text>
  <text x="590" y="210" text-anchor="end" class="s">1.0</text>
  <text x="590" y="145" text-anchor="end" class="s">1.5</text>
  <text x="590" y="84" text-anchor="end" class="s">2.0</text>
  <text x="560" y="210" transform="rotate(-90 560,210)" class="s">ν, %</text>

  <circle cx="640" cy="340" r="6" fill="#4a6fa5"/>
  <circle cx="710" cy="340" r="6" fill="#6b8f71"/>
  <circle cx="780" cy="106" r="6" fill="#c4a35a"/>
  <circle cx="850" cy="314" r="6" fill="#c45c26"/>
  <polyline points="640,340 710,340 780,106 850,314" fill="none" stroke="#8a94a6" stroke-width="1.4"/>

  <text x="640" y="360" text-anchor="middle" class="s">CONST</text>
  <text x="710" y="360" text-anchor="middle" class="s">ASTRO</text>
  <text x="780" y="360" text-anchor="middle" class="s">LOCAL</text>
  <text x="850" y="360" text-anchor="middle" class="s">LUMEN</text>
  <text x="780" y="96" text-anchor="middle" class="s">1.8</text>
  <text x="850" y="304" text-anchor="middle" class="s">0.2</text>

  <text x="80" y="400" class="s">LUMEN даёт наименьшую энергию при ν ≈ 0.2 %. LOCAL экономит, но нарушает норму почти 2 % ночи.</text>
</svg>
